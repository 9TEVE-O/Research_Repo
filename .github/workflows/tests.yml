name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Compile Python source and tests
        run: python -m compileall -q .

      - name: Run owned-research SQLite and Markdown regressions
        run: python -m pytest -q tests/test_owned_research.py -k markdown

      - name: Run tests
        run: python -m pytest -q
