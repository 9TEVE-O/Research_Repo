name: Daily Research Scan
on:
  schedule:
    - cron: '0 8 * * *'   # 8 AM UTC daily
  workflow_dispatch:       # manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Run research agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          REPORT_RECIPIENT: ${{ secrets.EMAIL_TO }}
        run: python agent.py

      - name: Check Gist config
        id: gist_config
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          RESEARCH_GIST_ID: ${{ secrets.RESEARCH_GIST_ID }}
        run: |
          if [[ -n "$GIST_TOKEN" && -n "$RESEARCH_GIST_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check report file
        id: check_report
        run: |
          if [[ -f reports/latest.md ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit report to Gist
        if: ${{ steps.gist_config.outputs.configured == 'true' && steps.check_report.outputs.exists == 'true' }}
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: ${{ secrets.RESEARCH_GIST_ID }}
          file_path: reports/latest.md

      - name: Skip Gist report
        if: ${{ steps.gist_config.outputs.configured != 'true' || steps.check_report.outputs.exists != 'true' }}
        run: |
          echo "::warning::Skipping Gist publish because GIST_TOKEN, RESEARCH_GIST_ID, or reports/latest.md is missing."
